<ion-header class="add-header">
  <ion-toolbar>
    <ion-title>Adicionar produto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" aria-label="Fechar">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="add-content">

  <!-- Produto: busca e digitação no mesmo campo -->
  <label class="campo-label" for="campo-produto">Produto</label>

  <div class="campo-produto" [class.aberto]="mostrarSugestoes && sugestoes.length > 0">
    <ion-icon name="search-outline" class="campo-icone"></ion-icon>
    <input
      #nomeProdutoInput
      id="campo-produto"
      class="campo-input"
      type="text"
      autocomplete="off"
      autocapitalize="sentences"
      [(ngModel)]="nome"
      (ngModelChange)="onNomeChange()"
      (focus)="onNomeFoco()"
      placeholder="Ex: Arroz branco" />
    <button
      *ngIf="nome"
      type="button"
      class="campo-limpar"
      (click)="limparNome()"
      aria-label="Limpar">
      <ion-icon name="close-circle"></ion-icon>
    </button>
  </div>

  <!-- Sugestões do catálogo -->
  <div class="sugestoes" *ngIf="mostrarSugestoes && sugestoes.length > 0">
    <button
      type="button"
      class="sugestao"
      *ngFor="let produto of sugestoes"
      (click)="escolherProduto(produto)">
      <ion-icon
        class="sugestao-icone"
        [name]="produto.favorito ? 'star' : 'pricetag-outline'"
        [class.favorito]="produto.favorito"></ion-icon>
      <span class="sugestao-nome">{{ produto.nome }}</span>
      <span class="sugestao-preco" *ngIf="precoSugerido(produto) as preco">
        {{ formatarMoedaSimples(preco) }}
      </span>
    </button>
  </div>

  <!-- Atalhos: só quando o campo está vazio, para não competir com a busca -->
  <div class="atalhos" *ngIf="!nome && atalhos.length > 0">
    <p class="atalhos-titulo">Você costuma comprar</p>
    <div class="atalhos-lista">
      <button
        type="button"
        class="atalho"
        *ngFor="let produto of atalhos"
        (click)="escolherProduto(produto)">
        <ion-icon [name]="produto.favorito ? 'star' : 'add'" [class.favorito]="produto.favorito"></ion-icon>
        {{ produto.nome }}
      </button>
    </div>
  </div>

  <!-- Quantidade e unidade lado a lado -->
  <div class="linha-dupla">
    <div class="coluna">
      <label class="campo-label" for="campo-quantidade">Quantidade</label>
      <div class="stepper">
        <button type="button" class="stepper-btn" (click)="alterarQuantidade(-1)" aria-label="Diminuir">
          <ion-icon name="remove"></ion-icon>
        </button>
        <input
          id="campo-quantidade"
          class="stepper-input"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.5"
          [(ngModel)]="quantidade"
          (ngModelChange)="normalizarQuantidade()" />
        <button type="button" class="stepper-btn" (click)="alterarQuantidade(1)" aria-label="Aumentar">
          <ion-icon name="add"></ion-icon>
        </button>
      </div>
    </div>

    <div class="coluna estreita">
      <label class="campo-label" for="campo-unidade">Unidade</label>
      <ion-select
        id="campo-unidade"
        class="campo-select"
        [(ngModel)]="unidade"
        interface="action-sheet"
        [interfaceOptions]="{ header: 'Unidade de medida' }">
        <ion-select-option *ngFor="let u of unidades" [value]="u.valor">{{ u.rotulo }}</ion-select-option>
      </ion-select>
    </div>
  </div>

  <!-- Preço, opcional -->
  <label class="campo-label" for="campo-preco">
    Preço unitário <span class="opcional">opcional</span>
  </label>
  <div class="campo-preco">
    <input
      id="campo-preco"
      class="campo-input"
      type="text"
      inputmode="numeric"
      [(ngModel)]="precoTexto"
      (ngModelChange)="onPrecoChange($event)"
      placeholder="R$ 0,00" />
  </div>

  <div class="subtotal" *ngIf="subtotal > 0">
    <span>Subtotal</span>
    <strong>{{ formatarMoedaSimples(subtotal) }}</strong>
  </div>

  <!-- Já comprado -->
  <div class="ja-comprado">
    <div class="ja-comprado-texto">
      <strong>Já está no carrinho</strong>
      <small>Marque se você já pegou este item</small>
    </div>
    <ion-toggle [(ngModel)]="feito" aria-label="Já está no carrinho"></ion-toggle>
  </div>

</ion-content>

<ion-footer class="add-footer">
  <div class="acoes">
    <ion-button fill="clear" color="medium" (click)="dismiss()">Cancelar</ion-button>
    <ion-button expand="block" class="botao-salvar" [disabled]="!podeSalvar()" (click)="salvar()">
      Adicionar
    </ion-button>
  </div>
</ion-footer>
