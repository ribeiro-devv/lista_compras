<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-hero compact">
    <div class="logo-badge">
      <ion-icon name="person-add"></ion-icon>
    </div>
    <h1>Criar conta</h1>
    <p>Preencha os dados para começar</p>
  </div>

  <div class="auth-card">
    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="field">
        <label>Nome</label>
        <ion-item lines="none" class="form-item" [class.has-error]="name?.invalid && (name?.touched || name?.dirty)">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text" formControlName="name" placeholder="Seu nome"></ion-input>
        </ion-item>
        <div class="error-text" *ngIf="name?.invalid && (name?.touched || name?.dirty)">
          <span *ngIf="name?.errors?.['required']">Nome é obrigatório</span>
          <span *ngIf="name?.errors?.['minlength']">Nome deve ter no mínimo 3 caracteres</span>
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <ion-item lines="none" class="form-item" [class.has-error]="email?.invalid && (email?.touched || email?.dirty)">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input type="email" formControlName="email" placeholder="seu@email.com"></ion-input>
        </ion-item>
        <div class="error-text" *ngIf="email?.invalid && (email?.touched || email?.dirty)">
          <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <div class="field">
        <label>Senha</label>
        <ion-item lines="none" class="form-item" [class.has-error]="password?.invalid && (password?.touched || password?.dirty)">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Mínimo 6 caracteres"></ion-input>
          <ion-button fill="clear" slot="end" (click)="togglePassword()" type="button" class="eye-btn">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
        <div class="error-text" *ngIf="password?.invalid && (password?.touched || password?.dirty)">
          <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
        </div>
      </div>

      <div class="field">
        <label>Confirmar senha</label>
        <ion-item lines="none" class="form-item" [class.has-error]="confirmPassword?.invalid && (confirmPassword?.touched || confirmPassword?.dirty)">
          <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
          <ion-input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Repita a senha"></ion-input>
          <ion-button fill="clear" slot="end" (click)="toggleConfirmPassword()" type="button" class="eye-btn">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
        <div class="error-text" *ngIf="confirmPassword?.invalid && (confirmPassword?.touched || confirmPassword?.dirty)">
          <span *ngIf="confirmPassword?.errors?.['required']">Confirmação de senha é obrigatória</span>
          <span *ngIf="confirmPassword?.errors?.['passwordMismatch']">As senhas não coincidem</span>
        </div>
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="registerForm.invalid || isLoading"
        class="primary-button">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        Criar conta
      </ion-button>

      <!-- Cadastro com Google desativado (opcional). Para reativar, remova o
           comentário abaixo e habilite o provider Google no Supabase.
      <div class="divider"><span>ou</span></div>
      <ion-button
        expand="block"
        fill="outline"
        (click)="registerWithGoogle()"
        [disabled]="isLoading"
        class="google-button">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Cadastrar com Google
      </ion-button>
      -->

      <div class="register-link">
        <p>Já tem uma conta? <a (click)="goToLogin()">Faça login</a></p>
      </div>
    </form>
  </div>
</ion-content>
