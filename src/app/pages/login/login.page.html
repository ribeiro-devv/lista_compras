<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-hero">
    <div class="logo-badge">
      <ion-icon name="cart"></ion-icon>
    </div>
    <h1>Lista de Compras</h1>
    <p>Bem-vindo de volta! Entre para continuar.</p>
  </div>

  <div class="auth-card">
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="field">
        <label>Email</label>
        <ion-item lines="none" class="form-item" [class.has-error]="email?.invalid && (email?.touched || email?.dirty)">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            type="email"
            formControlName="email"
            placeholder="seu@email.com">
          </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="email?.invalid && (email?.touched || email?.dirty)">
          <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="email?.errors?.['email']">Email inválido</span>
        </div>
      </div>

      <div class="field">
        <label>Senha</label>
        <ion-item lines="none" class="form-item" [class.has-error]="password?.invalid && (password?.touched || password?.dirty)">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Digite sua senha">
          </ion-input>
          <ion-button fill="clear" slot="end" (click)="togglePassword()" type="button" class="eye-btn">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
        <div class="error-text" *ngIf="password?.invalid && (password?.touched || password?.dirty)">
          <span *ngIf="password?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="password?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
        </div>
      </div>

      <div class="forgot-password">
        <ion-button fill="clear" size="small" (click)="resetPassword()" type="button">
          Esqueci minha senha
        </ion-button>
      </div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="primary-button">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Entrar
      </ion-button>

      <!-- Login com Google desativado (opcional). Para reativar, remova o
           comentário abaixo e habilite o provider Google no Supabase.
      <div class="divider"><span>ou</span></div>
      <ion-button
        expand="block"
        fill="outline"
        (click)="loginWithGoogle()"
        [disabled]="isLoading"
        class="google-button">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Entrar com Google
      </ion-button>
      -->

      <div class="register-link">
        <p>Não tem uma conta? <a (click)="goToRegister()">Cadastre-se</a></p>
      </div>
    </form>
  </div>
</ion-content>
